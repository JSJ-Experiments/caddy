name: Blacksmith Testbox
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043 # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.3'
          cache: true
      - name: Expose pinned Go to testbox SSH sessions
        run: sudo ln -sf "$(command -v go)" /usr/local/bin/go
      - name: Match live-machine UDP buffer limits
        run: sudo sysctl -w net.core.rmem_max=26214400 net.core.wmem_max=26214400
      - name: Download and verify pinned dependencies
        run: go mod download && go mod verify
      - name: Run Testbox
        uses: useblacksmith/run-testbox@5ca05834db1d3813554d1dd109e5f2087a8d7cbc # v2
        if: always()
